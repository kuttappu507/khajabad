name: Smoke test (emulator)

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

jobs:
  smoke:
    name: Boot app on emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            ADB="$ANDROID_HOME/platform-tools/adb"
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)

            $ADB install -r "$APK"
            $ADB logcat -c
            $ADB shell am start -W -n com.khajabad.app/.MainActivity
            sleep 12

            echo "===== focused activity ====="
            $ADB shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" | head -3

            echo "===== crashes ====="
            $ADB logcat -d -b crash | tail -200 || true

            echo "===== androidRuntime ====="
            $ADB logcat -d | grep -iE "FATAL|AndroidRuntime|khajabad|Exception" | tail -300 || true

            echo "===== app process ====="
            $ADB shell pidof com.khajabad.app || echo "PROCESS NOT RUNNING"

            $ADB logcat -d > logcat.txt || true
            $ADB shell screencap -p /sdcard/shot.png && $ADB pull /sdcard/shot.png shot.png || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            logcat.txt
            shot.png
          if-no-files-found: warn
