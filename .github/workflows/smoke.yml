name: Smoke test

on:
  push:
    branches: [ main, 'arena/**' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jvm:
    name: JVM launch test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run launch test
        id: test
        continue-on-error: true
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest --console=plain > test.log 2>&1

      - name: Publish diagnostics
        if: always()
        run: |
          mkdir -p docs/ci
          # Only keep logs for red builds; a green run leaves the tree clean.
          if [ "${{ steps.test.outcome }}" = "failure" ] && [ -f test.log ]; then
            cp test.log docs/ci/jvm-test.log
          else
            rm -f docs/ci/jvm-test.log
          fi
          git config user.name "khajabad-ci"
          git config user.email "ci@khajabad.app"
          git add -f docs/ci
          git commit -m "ci: jvm diagnostics [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME} && break || sleep 5
          done

      - name: Fail if the app did not launch
        if: steps.test.outcome == 'failure'
        run: exit 1

  emulator:
    name: Boot app on emulator (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        id: emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ADB="$ANDROID_HOME/platform-tools/adb"
            APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
            $ADB install -r "$APK"
            $ADB logcat -c
            $ADB shell am start -W -n com.khajabad.app/.MainActivity
            sleep 12
            $ADB shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > activity.txt || true
            $ADB logcat -d > logcat.txt || true
            $ADB shell screencap -p /sdcard/shot.png && $ADB pull /sdcard/shot.png shot.png || true
            cat activity.txt || true

      - name: Publish diagnostics
        if: always()
        run: |
          mkdir -p docs/ci
          if [ -f logcat.txt ]; then
            grep -iE "FATAL|AndroidRuntime|Caused by|khajabad|Exception" logcat.txt | tail -400 > docs/ci/logcat.txt || true
          fi
          if [ -f shot.png ]; then cp shot.png docs/ci/emulator.png; fi
          if [ -s activity.txt ]; then cp activity.txt docs/ci/activity.txt; else rm -f docs/ci/activity.txt; fi
          git config user.name "khajabad-ci"
          git config user.email "ci@khajabad.app"
          git add -f docs/ci
          git commit -m "ci: emulator diagnostics [skip ci]" || exit 0
          for i in 1 2 3; do
            git pull --rebase origin ${GITHUB_REF_NAME} || true
            git push origin HEAD:${GITHUB_REF_NAME} && break || sleep 5
          done

      - name: Fail if the app crashed
        run: |
          if [ ! -s logcat.txt ]; then
            echo "no logcat captured — the emulator probably never booted" >&2
            exit 1
          fi
          if grep -q "FATAL EXCEPTION" logcat.txt; then
            echo "crash in logcat (see docs/ci/logcat.txt)" >&2
            exit 1
          fi
          echo "no fatal exceptions"
