name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble release + debug
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleRelease assembleDebug --console=plain --stacktrace > build.log 2>&1

      - name: Show compiler errors
        if: steps.assemble.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re, os
          text = open('build.log', errors='ignore').read()
          hits = []
          for line in text.splitlines():
              if re.match(r'^e: ', line) or "error:" in line or line.startswith("FAILURE:") or "Caused by:" in line:
                  hits.append(" ".join(line.split()))
          hits = hits[:60]
          report = "\n".join(hits)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write("## Build errors\n\n```\n" + report[:60000] + "\n```\n")
          for line in hits[:20]:
              print("::error::" + line.replace("%", "%25").replace("\r", "")[:900])
          print(report)
          PY
          exit 1

      - name: Check signing and manifest
        if: steps.assemble.outcome == 'success'
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "==== apksigner ===="
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          echo "==== badging ===="
          "$BT/aapt2" dump badging "$APK" | head -20

      - name: Rename for humans
        if: steps.assemble.outcome == 'success'
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/khajabad.apk
          ls -la out

      - name: Upload APKs
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: khajabad-apk
          path: |
            out/khajabad.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Direct .apk download (no zip) at releases/tag/latest
      - name: Publish download
        if: steps.assemble.outcome == 'success' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "khajabad · latest build" \
              --notes "Signed, installable APK. Download \`khajabad.apk\` below." --latest
          gh release upload latest out/khajabad.apk --clobber
          gh release edit latest --notes "Signed, installable APK (versionCode from this commit). If Android says \"App not installed\", uninstall any older khajabad copy first — it was signed with a different key." --latest
