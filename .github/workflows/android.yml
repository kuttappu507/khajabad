name: Android CI

on:
  push:
    branches: [ main, 'arena/**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        id: assemble
        continue-on-error: true
        run: ./gradlew assembleDebug --console=plain --stacktrace > build.log 2>&1

      - name: Show compiler errors
        if: steps.assemble.outcome == 'failure'
        run: |
          python3 - <<'PY'
          import re, os
          text = open('build.log', errors='ignore').read()
          hits = []
          for line in text.splitlines():
              if re.match(r'^e: ', line) or "error:" in line or line.startswith("FAILURE:") or "Caused by:" in line:
                  hits.append(" ".join(line.split()))
          hits = hits[:60]
          report = "\n".join(hits)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as fh:
              fh.write("## Build errors\n\n```\n" + report[:60000] + "\n```\n")
          for line in hits[:20]:
              print("::error::" + line.replace("%", "%25").replace("\r", "")[:900])
          print(report)
          PY
          exit 1

      - name: Upload APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: khajabad-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
