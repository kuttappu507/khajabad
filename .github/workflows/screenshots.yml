name: Preview screenshots

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm i playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Serve preview
        run: |
          cd preview
          python3 -m http.server 8080 &
          sleep 2

      - name: Capture
        run: node preview/screenshots.cjs

      - name: Commit screenshots
        run: |
          git config user.name "khajabad-bot"
          git config user.email "bot@khajabad.app"
          git add docs/screens
          if git diff --cached --quiet; then
            echo "screenshots unchanged"
            exit 0
          fi
          git commit -m "docs: refresh UI screenshots [skip ci]"
          # A human push may land while the browser is capturing; rebase and retry
          # instead of failing the workflow.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep $((i * 4))
          done
          echo "could not push screenshots after 5 attempts" >&2
          exit 1
